# GemReserve.io — WordPress production vhost
#
# Target file: /etc/nginx/sites-enabled/www.gemreserve.io.conf
#
# ---------------------------------------------------------------------------
# The request path, as measured on this host — not as assumed
# ---------------------------------------------------------------------------
#
#   visitor --HTTPS--> Cloudflare --HTTPS:443--> AWS ALB --HTTP:80--> nginx
#
# TLS is terminated twice before nginx ever sees the request. Cloudflare talks
# to the ALB, which holds an Amazon-issued certificate for gemreserve.io and
# *.gemreserve.io; the ALB then forwards to this host in the clear. So for
# EVERY public request, including the ones the visitor made over HTTPS:
#
#     $scheme       = http
#     $server_port  = 80
#     $ssl_protocol = (empty)
#     $remote_addr  = 10.0.1.75 / 10.0.2.245   (the ALB, not Cloudflare)
#
# and the visitor's real protocol arrives only in headers the ALB sets:
#
#     X-Forwarded-Proto: https
#     X-Forwarded-For:   <visitor>, <cloudflare edge>
#     CF-Visitor:        {"scheme":"https"}
#     CF-Connecting-IP:  <visitor>
#
# This is the whole reason the previous cutover failed. The earlier version of
# this file put the site on `listen 443` only and gave port 80 a blanket
# `return 301 https://www.gemreserve.io$request_uri`. Every public request
# lands on port 80, so every public request was answered with a redirect to
# itself, and the redirect came back through the same block — an unbreakable
# loop, generated here at the origin and merely relayed by Cloudflare.
#
# Nothing below decides anything from $scheme. $gr_visitor_scheme is the
# visitor's real protocol, and it is the only scheme this file trusts.
#
# Deliberately does NOT `include /etc/nginx/global_settings;`. That file sets
# X-Frame-Options, X-Content-Type-Options and Referrer-Policy, and the Next.js
# app set its own — which is why the live response carried each of those twice,
# with two different Referrer-Policy values. This vhost defines the full header
# set once, so there is one policy and one place to change it.

# --- Rate limits ----------------------------------------------------------
# http scope, which is where an included sites-enabled file already is.
#
# $binary_remote_addr resolves to the VISITOR's address, not the ALB's: the
# realip module runs in the post-read phase, which is after server selection
# and before limit_req is evaluated in the preaccess phase. The server-level
# real_ip config below is therefore already in force when these keys are built.
# Without that, every visitor would share one bucket keyed on the load
# balancer, and one person hitting wp-login would lock out everybody.
limit_req_zone $binary_remote_addr zone=gr_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gr_forms:10m rate=20r/m;

# --- Who is allowed to tell us the visitor's protocol ----------------------
# $realip_remote_addr is the ORIGINAL TCP peer, untouched by the real_ip
# rewriting below — so this gate cannot be moved by anything in a header.
#
# The instance has no public IP (confirmed against the instance metadata
# service): the ALB inside 10.0.0.0/16 is the only thing that can open a
# connection to it. An internet client therefore has no path by which to
# assert its own scheme. If the host is ever given a public address, this is
# the single directive that has to be narrowed.
#
# When no proxy header is present at all, realip declines and this variable is
# empty, which geo answers with the default — untrusted. That is the correct
# answer for a direct probe.
geo $realip_remote_addr $gr_from_trusted_proxy {
    default       0;
    127.0.0.1/32  1;
    ::1/128       1;
    10.0.0.0/8    1;
}

# The ALB's X-Forwarded-Proto, honoured only from a trusted peer.
map "$gr_from_trusted_proxy:$http_x_forwarded_proto" $gr_scheme_xfp {
    default   "";
    "1:https" "https";
    "1:http"  "http";
}

# Cloudflare's CF-Visitor, same gate, as a fallback for the case where the ALB
# listener is ever reconfigured without X-Forwarded-Proto. Matched loosely so a
# change in Cloudflare's spacing does not silently break scheme detection.
# "https" is tested first; the closing quote in the second pattern stops it
# matching an https value.
map "$gr_from_trusted_proxy:$http_cf_visitor" $gr_scheme_cfv {
    default                         "";
    '~^1:.*"scheme"\s*:\s*"https"'  "https";
    '~^1:.*"scheme"\s*:\s*"http"'   "http";
}

# X-Forwarded-Proto wins; CF-Visitor is consulted only when it is absent.
map $gr_scheme_xfp $gr_scheme_fwd {
    default  $gr_scheme_xfp;
    ""       $gr_scheme_cfv;
}

# The visitor's protocol. Falls back to the real connection scheme when no
# trusted proxy said anything, which is what a direct origin test wants.
map $gr_scheme_fwd $gr_visitor_scheme {
    default  $gr_scheme_fwd;
    ""       $scheme;
}

# Redirect to canonical HTTPS ONLY when a trusted proxy states the visitor was
# on plain HTTP. An absent header is NOT treated as http: an ALB health check
# and a local probe carry no X-Forwarded-Proto, and answering those with a 301
# would fail the health check and take the target group out of service. This
# matches what the Next.js vhost does today, where the equivalent redirect is
# commented out for exactly this reason.
map $gr_scheme_fwd $gr_redirect_to_https {
    default  0;
    "http"   1;
}

# What PHP is told. Derived, never hardcoded: WordPress's is_ssl() reads
# $_SERVER['HTTPS'], and content_url()/get_template_directory_uri() pass their
# result through set_url_scheme(), which emits http:// for every theme asset
# when is_ssl() is false. An empty value is correct for a genuine plain-HTTP
# request — is_ssl() sees the key set, not equal to "on" or "1", and returns
# false without consulting SERVER_PORT.
map $gr_visitor_scheme $gr_fastcgi_https {
    default  "";
    "https"  "on";
}

# SERVER_PORT is reported as the port the VISITOR used, so $_SERVER is
# internally consistent for any code that reads it directly.
map $gr_visitor_scheme $gr_server_port {
    default  "80";
    "https"  "443";
}

# --- Content Security Policy ---------------------------------------------
# http scope, because a map cannot live inside a server block.
#
# The public policy is character-for-character the one the Next.js site served
# and is UNCHANGED by everything below: it keeps `frame-ancestors 'none'` and
# gains no `blob:`. Every relaxation here applies to /wp-admin and
# /wp-login.php only.
#
# The admin needs more than 'unsafe-eval', and the reason is an outage the
# client hit. WordPress 6.3+ renders the block editor canvas inside an iframe
# whose document is assembled at runtime and handed over as a `blob:` URL. With
# no `frame-src`, CSP falls back to `default-src 'self'`, which does not cover
# `blob:` — so the browser refused the canvas and a marketing user opening any
# page saw "This content is blocked", an empty editor, and
# `TypeError: Cannot destructure property 'documentElement' of null`. The page's
# blocks were present and valid throughout; the frame they render into never
# loaded.
#
# Established by elimination against production, not by reasoning: with the
# header stripped at the browser the canvas renders its sections and throws no
# page error; with the header restored, zero sections and four page errors.
#
# What each addition is for, so none of it is cargo-culted:
#   frame-src / child-src blob:   the canvas iframe itself
#   default-src blob:             that document's own subresource fetches
#   script-src / style-src blob:  the editor injects its bundles into it
#   connect-src blob:             reading the blob back
#   img-src secure.gravatar.com   the admin-bar avatar, otherwise blocked and
#                                 logging a CSP violation on every admin page
#
# `blob:` is same-origin by construction — only script already running on this
# origin can mint one — so this admits nothing reachable from outside.
# `object-src 'none'`, `base-uri 'self'` and `form-action 'self'` are untouched,
# and no external script origin is added.
map $uri $gr_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

    "~^/wp-admin"      "default-src 'self' blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https://secure.gravatar.com; font-src 'self' data:; connect-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob: data:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    "~^/wp-login\.php" "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

# ===========================================================================
# The site
# ===========================================================================
server {
    # Both ports, one block. Public traffic only ever arrives on 80; 443 is
    # kept so a direct origin test reaches the same configuration the public
    # does, rather than a different one that proves nothing.
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gemreserve.io;

    # Presented only to the ALB and to local tests. Cloudflare never sees this
    # certificate — it terminates against the ALB's Amazon-issued one — so its
    # being self-signed does not constrain the Cloudflare SSL mode.
    ssl_certificate     /etc/nginx/ssl-certificates/www.gemreserve.io.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/www.gemreserve.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/GemReserve/wordpress;
    index index.php;

    access_log /home/gemreserve1/logs/nginx/access.log main;
    error_log  /home/gemreserve1/logs/nginx/error.log;

    # nginx's own generated redirects — the trailing slash try_files adds for a
    # directory — are built from $scheme, which is http here even for an HTTPS
    # visitor. Emitting them relative removes the scheme from the question
    # entirely. Explicit `return 301 https://...` below is unaffected.
    absolute_redirect off;

    # --- Client IP behind the ALB and Cloudflare -------------------------
    # The global nginx.conf carries `set_real_ip_from 0.0.0.0/0;` — trust any
    # source — with no active real_ip_header. That pairing is inert today, but
    # it is one directive away from letting any client set its own address.
    # These directives are array-type: defining them at THIS level replaces the
    # inherited list entirely rather than adding to it, so naming the real hops
    # here narrows 0.0.0.0/0 down to them for this vhost without touching
    # nginx.conf.
    #
    # X-Forwarded-For, not CF-Connecting-IP. The TCP peer is the ALB, which is
    # in no Cloudflare range, so a CF-Connecting-IP rule keyed on Cloudflare's
    # ranges would never fire and every visitor would log and rate-limit as the
    # load balancer. With recursive on, nginx walks the list right to left and
    # stops at the first address it does not trust:
    #
    #   peer 10.0.1.75 (ALB, trusted) -> 104.23.197.242 (Cloudflare, trusted)
    #   -> 3.21.73.22 (untrusted) = the visitor.
    #
    # That is also what makes it unspoofable: a client that injects its own
    # X-Forwarded-For has its real address appended after the forged entry by
    # the hop in front, and the walk stops there.
    #
    # Cloudflare ranges refreshed from https://www.cloudflare.com/ips/.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1/32;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # --- Canonical HTTPS --------------------------------------------------
    # Fires only on a trusted proxy's explicit "the visitor used http". Cannot
    # loop: the loop needed $scheme, and $scheme is not consulted.
    if ($gr_redirect_to_https) {
        return 301 https://www.gemreserve.io$request_uri;
    }

    # --- Security headers -------------------------------------------------
    add_header Content-Security-Policy   $gr_csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    client_max_body_size 32m;

    # --- ACME, before anything that could swallow it ----------------------
    # `^~` beats every regex location, so this wins over the dotfile denial
    # below regardless of order in the file. It is placed first anyway, because
    # the next person to add a deny rule will read top-down.
    #
    # The root is the CloudPanel document root, where the ACME client writes
    # its challenge files. Renewal reaches it over the ALB, which redirects
    # port 80 to 443 and is followed by every ACME client.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        root /home/gemreserve1/htdocs/www.gemreserve.io;
        try_files $uri =404;
    }

    # --- Refuse everything that is not the site --------------------------
    # These must precede the PHP handler, or a request for wp-config.php is
    # answered by executing it rather than by refusing it.

    # Dotfiles: .git, .env, and the SQLite database's .ht.sqlite name.
    # /.well-known/acme-challenge/ is exempted above.
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # Databases and dumps, in every form they might take.
    location ~* /wp-content/database/ { deny all; }
    location ~* \.(sqlite|sqlite3|db|sql|gz|tar|zip|bak|swp|old|orig|ini|log)$ { deny all; }

    # Config and secrets.
    location = /wp-config.php  { deny all; }
    location = /wp-salts.php   { deny all; }
    location = /router.php     { deny all; }   # staging only; never production
    location ~ ^/gr-[a-z-]+\.php$ { deny all; }  # migration scripts
    location ^~ /backups/      { deny all; }
    location ^~ /migrations/   { deny all; }

    # WordPress's own noise.
    location = /readme.html    { deny all; }
    location = /license.txt    { deny all; }
    location = /wp-config-sample.php { deny all; }

    # XML-RPC is disabled in code; refuse it at the edge too so the request
    # never reaches PHP.
    location = /xmlrpc.php { deny all; access_log off; }

    # Uploads hold data, never code. This is the second half of the ownership
    # model: uploads/ is the one directory php-fpm can write to, so it is also
    # the one directory where an uploaded .php must never be executed.
    location ~* /wp-content/uploads/.*\.(php|phtml|phar|cgi|pl|py|sh)$ { deny all; }

    # Theme and plugin PHP is included by WordPress, never requested.
    location ~* /wp-content/(themes|plugins|mu-plugins)/.+\.php$ { deny all; }

    # --- Things WordPress must answer, not the filesystem -----------------
    # Both are generated by PHP here; without these they fall to try_files and
    # 404 on a missing static file.
    location = /robots.txt  { try_files $uri /index.php?$args; access_log off; }
    location = /sitemap.xml { try_files $uri /index.php?$args; }

    # --- Static assets ----------------------------------------------------
    # add_header does not merge across levels: a location that defines ANY
    # add_header drops every one inherited from the server block. So the
    # security headers are repeated in each location that sets its own caching
    # header. Without this, every image and stylesheet would be served with no
    # nosniff and no CSP.
    location ~* ^/wp-content/themes/gemreserve/assets/.+\.(css|js|webp|avif|png|jpe?g|svg|woff2?)$ {
        # No `expires` here: it emits its own Cache-Control, and paired with
        # the add_header below the response carried the header twice with two
        # different values. One directive, one header.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy   $gr_csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(css|js|webp|avif|png|jpe?g|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header Content-Security-Policy   $gr_csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Login and admin --------------------------------------------------
    location = /wp-login.php {
        limit_req zone=gr_login burst=5 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS       $gr_fastcgi_https;
        fastcgi_param SERVER_PORT $gr_server_port;
        fastcgi_pass 127.0.0.1:19000;
    }

    location = /wp-admin/admin-post.php {
        limit_req zone=gr_forms burst=10 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS       $gr_fastcgi_https;
        fastcgi_param SERVER_PORT $gr_server_port;
        fastcgi_pass 127.0.0.1:19000;
    }

    # --- WordPress front controller ---------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # fastcgi_params sets both of these from the connection, which is
        # plain HTTP on port 80 here. They are overridden AFTER the include so
        # WordPress sees the visitor's protocol, not the ALB's back end hop.
        fastcgi_param HTTPS       $gr_fastcgi_https;
        fastcgi_param SERVER_PORT $gr_server_port;
        fastcgi_pass 127.0.0.1:19000;
        fastcgi_read_timeout 60s;
    }

    # Brotli is done at Cloudflare; the origin only needs gzip for the
    # origin-to-edge hop.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}

# ===========================================================================
# Non-canonical hosts
# ===========================================================================
# Every one of these redirects to a DIFFERENT host, so none of them can loop
# the way the previous version did — the target never matches the block that
# issued it.
#
# www1.gemreserve.io appears on port 80 only. The origin certificate names
# www.gemreserve.io and gemreserve.io, not www1; giving www1 a 443 block here
# would present a certificate that does not name it. Left off 443, it falls to
# the default server, which answers `ssl_reject_handshake on` — no certificate
# is presented at all, which is the correct outcome rather than a bad one.
server {
    listen 80;
    listen [::]:80;
    server_name gemreserve.io www1.gemreserve.io;

    # HTTP-01 challenges arrive on port 80. Without this the blanket redirect
    # below would 301 the validation request and renewal would fail.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        root /home/gemreserve1/htdocs/www.gemreserve.io;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.gemreserve.io$request_uri;
    }
}

# The apex over TLS. Named by the origin certificate, so it gets a real 443
# block rather than falling to the default server's handshake rejection.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gemreserve.io;
    ssl_certificate     /etc/nginx/ssl-certificates/www.gemreserve.io.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/www.gemreserve.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://www.gemreserve.io$request_uri;
}
