# GemReserve.io — WordPress production vhost (PROPOSAL, not applied)
#
# Target file: /etc/nginx/sites-enabled/www.gemreserve.io.conf
#
# This REPLACES the current vhost, which proxies to the Next.js app on
# 127.0.0.1:3000. Keep the original file: the rollback is a copy-back and a
# reload, not a rewrite.
#
# Deliberately does NOT `include /etc/nginx/global_settings;`. That file sets
# X-Frame-Options, X-Content-Type-Options and Referrer-Policy, and the Next.js
# app sets its own — which is why the live response carries each of those twice
# today, with two different Referrer-Policy values. This vhost defines the full
# header set once, so there is one policy and one place to change it.
#
# Everything below is measured against the live host. No markers remain.

# --- Rate limits ----------------------------------------------------------
# These must be at http scope, which is where an included sites-enabled file
# already is. Nothing in nginx.conf is modified.
#
# $binary_remote_addr resolves to the VISITOR's address, not Cloudflare's: the
# realip module runs in the post-read phase, which is after server selection
# and before limit_req is evaluated in the preaccess phase. The server-level
# real_ip config below is therefore already in force when these keys are built.
limit_req_zone $binary_remote_addr zone=gr_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gr_forms:10m rate=20r/m;

# --- Content Security Policy ---------------------------------------------
# http scope, because a map cannot live inside a server block.
#
# The public policy is character-for-character the one the Next.js site serves
# today. /wp-admin and /wp-login.php get exactly one addition — 'unsafe-eval' —
# because the block editor and several core admin bundles evaluate code at
# runtime and the dashboard does not load without it. The public site never
# gets that relaxation, and frame-ancestors stays 'none' there while the admin
# needs 'self' for its own media and preview frames.
map $uri $gr_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

    "~^/wp-admin"      "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    "~^/wp-login\.php" "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gemreserve.io;

    ssl_certificate     /etc/nginx/ssl-certificates/www.gemreserve.io.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/www.gemreserve.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/GemReserve/wordpress;
    index index.php;

    # --- Client IP behind Cloudflare -------------------------------------
    # The global nginx.conf carries `set_real_ip_from 0.0.0.0/0;` — trust any
    # source — with no active real_ip_header. That pairing is inert today, but
    # it is one directive away from letting any client set its own address.
    #
    # These directives are array-type: defining them at THIS level replaces the
    # inherited list entirely rather than adding to it. So naming Cloudflare's
    # ranges here narrows 0.0.0.0/0 down to Cloudflare for this vhost, without
    # touching nginx.conf.
    #
    # Refresh from https://www.cloudflare.com/ips/ before applying.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    # A no-op for a single-valued header, kept so the intent still holds if the
    # header is ever changed to X-Forwarded-For.
    real_ip_recursive on;

    # --- Security headers -------------------------------------------------
    # The full set, defined once. The public CSP is character-for-character the
    # policy the Next.js app serves today, so the switch is not a loosening.
    #
    # Referrer-Policy is strict-origin-when-cross-origin, the app's value.
    # global_settings said same-origin; both were being sent. This picks the
    # stricter-on-downgrade, more useful of the two rather than shipping both.
    add_header Content-Security-Policy   $gr_csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    client_max_body_size 32m;

    # --- ACME, before anything that could swallow it ----------------------
    # `^~` beats every regex location, so this wins over the dotfile denial
    # below regardless of order in the file. It is placed first anyway, because
    # the next person to add a deny rule will read top-down.
    #
    # The root is the EXISTING CloudPanel document root, not the WordPress one:
    # that is where the ACME client writes its challenge files, and it must
    # keep working after the switch or the certificate stops renewing.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        root /home/gemreserve1/htdocs/www.gemreserve.io;
        try_files $uri =404;
    }

    # --- Refuse everything that is not the site --------------------------
    # These must precede the PHP handler, or a request for wp-config.php is
    # answered by executing it rather than by refusing it.

    # Dotfiles: .git, .env, and the SQLite database's .ht.sqlite name.
    # /.well-known/acme-challenge/ is exempted above.
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # Databases and dumps, in every form they might take.
    location ~* /wp-content/database/ { deny all; }
    location ~* \.(sqlite|sqlite3|db|sql|gz|tar|zip|bak|swp|old|orig|ini|log)$ { deny all; }

    # Config and secrets.
    location = /wp-config.php  { deny all; }
    location = /wp-salts.php   { deny all; }
    location = /router.php     { deny all; }   # staging only; never production
    location ~ ^/gr-[a-z-]+\.php$ { deny all; }  # migration scripts
    location ^~ /backups/      { deny all; }
    location ^~ /migrations/   { deny all; }

    # WordPress's own noise.
    location = /readme.html    { deny all; }
    location = /license.txt    { deny all; }
    location = /wp-config-sample.php { deny all; }

    # XML-RPC is disabled in code; refuse it at the edge too so the request
    # never reaches PHP.
    location = /xmlrpc.php { deny all; access_log off; }

    # Uploads hold data, never code. This is the second half of the ownership
    # model: uploads/ is the one directory php-fpm can write to, so it is also
    # the one directory where an uploaded .php must never be executed.
    location ~* /wp-content/uploads/.*\.(php|phtml|phar|cgi|pl|py|sh)$ { deny all; }

    # Theme and plugin PHP is included by WordPress, never requested.
    location ~* /wp-content/(themes|plugins|mu-plugins)/.+\.php$ { deny all; }

    # --- Things WordPress must answer, not the filesystem -----------------
    # Both are generated by PHP here; without these they fall to try_files and
    # 404 on a missing static file.
    location = /robots.txt  { try_files $uri /index.php?$args; access_log off; }
    location = /sitemap.xml { try_files $uri /index.php?$args; }

    # --- Static assets ----------------------------------------------------
    # add_header does not merge across levels: a location that defines ANY
    # add_header drops every one inherited from the server block. So the
    # security headers are repeated in each location that sets its own caching
    # header. Without this, every image and stylesheet would be served with no
    # nosniff and no CSP.
    location ~* ^/wp-content/themes/gemreserve/assets/.+\.(css|js|webp|avif|png|jpe?g|svg|woff2?)$ {
        # No `expires` here: it emits its own Cache-Control, and paired with
        # the add_header below the response carried the header twice with two
        # different values. One directive, one header.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy   $gr_csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(css|js|webp|avif|png|jpe?g|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header Content-Security-Policy   $gr_csp always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Login and admin --------------------------------------------------
    location = /wp-login.php {
        limit_req zone=gr_login burst=5 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:19000;
    }

    location = /wp-admin/admin-post.php {
        limit_req zone=gr_forms burst=10 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:19000;
    }

    # --- WordPress front controller ---------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:19000;
        fastcgi_read_timeout 60s;
    }

    # Brotli is done at Cloudflare; the origin only needs gzip for the
    # origin-to-edge hop.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}

# --- Plain HTTP -----------------------------------------------------------
# Measured live: gemreserve.io 301s to https://www.gemreserve.io/. This
# preserves that direction.
#
# www1.gemreserve.io is included HERE and only here. The origin certificate
# covers www.gemreserve.io and gemreserve.io — verified by reading it from
# 127.0.0.1:443 — and NOT www1. Adding a 443 server block for www1 would
# present a certificate that does not name it, which is a browser-level
# warning on a host that currently has none. Over plain HTTP no certificate is
# involved, so the redirect is safe and www1 still lands on the canonical site.
# If www1 is later added to the certificate, give it its own 443 block that
# redirects the same way.
server {
    listen 80;
    listen [::]:80;
    server_name gemreserve.io www.gemreserve.io www1.gemreserve.io;

    # HTTP-01 challenges arrive on port 80. Without this the blanket redirect
    # below would 301 the validation request and renewal would fail.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        root /home/gemreserve1/htdocs/www.gemreserve.io;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.gemreserve.io$request_uri;
    }
}

# The apex over TLS. Covered by the certificate, so it gets a real 443 block.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gemreserve.io;
    ssl_certificate     /etc/nginx/ssl-certificates/www.gemreserve.io.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/www.gemreserve.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://www.gemreserve.io$request_uri;
}
