# GemReserve.io — WordPress production vhost (PROPOSAL, not applied)
#
# This account cannot read /etc/nginx or /home/clp/services/nginx, so this is
# written from the standard CloudPanel + nginx + php-fpm layout rather than from
# your live file. DIFF IT AGAINST THE CURRENT VHOST BEFORE APPLYING. Three
# things in particular must be taken from the live file, not from here:
#
#   1. ssl_certificate / ssl_certificate_key paths
#   2. the php-fpm socket (CloudPanel names it per site user)
#   3. the exact apex -> www redirect currently in force
#
# The current vhost proxies to the Next.js app on 127.0.0.1:3000. Applying this
# replaces that proxy with a PHP document root. Keep the original file so the
# rollback in docs/WORDPRESS.md is a copy-back, not a rewrite.

# --- Rate limit the two endpoints worth attacking -------------------------
limit_req_zone $binary_remote_addr zone=gr_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gr_forms:10m rate=20r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gemreserve.io;

    # CONFIRM against the live vhost.
    ssl_certificate     /etc/nginx/ssl-certificates/www.gemreserve.io.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/www.gemreserve.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/GemReserve/wordpress;
    index index.php;

    # --- Security headers -------------------------------------------------
    # Carried over from the Next.js deployment. The CSP is deliberately looser
    # than that one in exactly one respect: 'unsafe-inline' for style-src,
    # because WordPress's admin emits inline styles. It is scoped so the public
    # site keeps the stricter policy.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 32m;

    # --- Refuse everything that is not the site --------------------------
    # Order matters: these must precede the PHP handler, or a request for
    # wp-config.php is answered by executing it rather than by refusing it.

    # Dotfiles: .git, .env, and the SQLite database's .ht.sqlite name.
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # The database, in every form it might take.
    location ~* /wp-content/database/ { deny all; }
    location ~* \.(sqlite|sqlite3|db|sql|sql\.gz|bak|swp|ini|log)$ { deny all; }

    # Config and secrets.
    location = /wp-config.php  { deny all; }
    location = /wp-salts.php   { deny all; }
    location = /router.php     { deny all; }   # staging only; never production
    location ~ ^/gr-[a-z-]+\.php$ { deny all; }  # migration scripts

    # WordPress's own noise.
    location = /readme.html    { deny all; }
    location = /license.txt    { deny all; }
    location = /wp-config-sample.php { deny all; }

    # XML-RPC is disabled in code; refuse it at the edge too so the request
    # never reaches PHP.
    location = /xmlrpc.php { deny all; access_log off; }

    # Uploads hold data, never code.
    location ~* /wp-content/uploads/.*\.(php|phtml|phar|cgi|pl|py|sh)$ { deny all; }

    # Theme and plugin PHP is included by WordPress, never requested.
    location ~* /wp-content/(themes|plugins|mu-plugins)/.+\.php$ { deny all; }

    # --- Static assets ----------------------------------------------------
    # The 508 image derivatives and the stylesheet are content-hashed by name
    # and change only on deploy, so they cache hard.
    location ~* ^/wp-content/themes/gemreserve/assets/.+\.(css|js|webp|avif|png|jpe?g|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(css|js|webp|avif|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # --- Login and admin --------------------------------------------------
    location = /wp-login.php {
        limit_req zone=gr_login burst=5 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm-gemreserve.sock;  # CONFIRM
    }

    location = /wp-admin/admin-post.php {
        limit_req zone=gr_forms burst=10 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.4-fpm-gemreserve.sock;  # CONFIRM
    }

    # --- WordPress front controller ---------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm-gemreserve.sock;  # CONFIRM
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# Apex and http redirect to the canonical www host. CONFIRM this matches the
# direction the live vhost already uses — reversing it breaks every existing
# canonical URL and every inbound link.
server {
    listen 80;
    listen [::]:80;
    server_name gemreserve.io www.gemreserve.io;
    return 301 https://www.gemreserve.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gemreserve.io;
    ssl_certificate     /etc/nginx/ssl-certificates/www.gemreserve.io.crt;  # CONFIRM
    ssl_certificate_key /etc/nginx/ssl-certificates/www.gemreserve.io.key;  # CONFIRM
    return 301 https://www.gemreserve.io$request_uri;
}
