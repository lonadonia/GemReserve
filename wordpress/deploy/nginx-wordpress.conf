# GemReserve.io — WordPress production vhost (PROPOSAL, not applied)
#
# Resolved against the live server on 2026-08-30. Two things still cannot be
# read from this account and are marked CONFIRM: the TLS certificate paths and
# whatever CloudPanel already includes into the vhost. Everything else below is
# measured, not assumed.
#
# WHAT WAS MEASURED
#
#   php-fpm      PHP 8.4.24, pool "default", listening on TCP 127.0.0.1:19000
#                as www-data. CloudPanel gives each PHP version a port, not a
#                unix socket: 7.4->14000, 8.0->15000, 8.1->16000, 8.2->17000,
#                8.3->18000, 8.4->19000, 8.5->20000. The earlier draft guessed
#                a unix socket. It was wrong.
#
#   redirect     gemreserve.io returns 301 to https://www.gemreserve.io/.
#                Apex -> www. Confirmed live; do not reverse it.
#
#   headers      The current CSP and Permissions-Policy are emitted by the
#                Next.js app, NOT by nginx — verified by reading the origin on
#                127.0.0.1:3000 directly. They disappear the moment PHP serves
#                the site, so they are reproduced here. Without this block,
#                switching to WordPress silently drops the entire CSP.
#
#                nginx already adds three headers of its own: the live response
#                carries X-Frame-Options twice (DENY from Next, SAMEORIGIN from
#                nginx), X-Content-Type-Options twice, and two different
#                Referrer-Policy values. Whatever adds those is in a CloudPanel
#                include this account cannot read. CONFIRM whether it still
#                applies after the switch; if it does, delete the duplicates
#                below rather than shipping two of each.
#
#   compression  Brotli is done at Cloudflare (the edge returns content-encoding:
#                br). The origin only needs gzip for the origin->edge hop.
#
#   edge         Cloudflare fronts this origin. See the real-IP note below: it
#                matters for rate limiting and for what the contact form stores.
#
# The current vhost proxies to the Next.js app on 127.0.0.1:3000. Applying this
# replaces that proxy with a PHP document root. Keep the original file — the
# rollback is a copy-back, not a rewrite.

# --- Client IP behind Cloudflare -----------------------------------------
# Without this, $remote_addr is a Cloudflare edge address for every visitor.
# Two things then break quietly: the rate limits below bucket the entire
# internet into a handful of keys, and the contact form stores a Cloudflare IP
# prefix against every enquiry instead of the sender's.
#
# CONFIRM whether the live vhost already restores the real IP — if it does,
# delete this block rather than setting it twice. The list is Cloudflare's
# published ranges; refresh from https://www.cloudflare.com/ips/ before use.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- Rate limit the two endpoints worth attacking -------------------------
limit_req_zone $binary_remote_addr zone=gr_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gr_forms:10m rate=20r/m;

# --- Content Security Policy ---------------------------------------------
# The public policy is character-for-character the one the Next.js site serves
# today, so the switch is not a loosening. /wp-admin and /wp-login.php get one
# addition — 'unsafe-eval' — because the block editor and several core admin
# bundles evaluate code at runtime and the admin does not load without it. The
# public site never gets that relaxation.
map $uri $gr_csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";

    "~^/wp-admin"     "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    "~^/wp-login\.php" "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gemreserve.io;

    # CONFIRM: read these two paths out of the live vhost. CloudPanel keeps
    # them under /etc/nginx/ssl-certificates/<domain>.crt|.key, but this
    # account cannot read /etc/nginx to check, and a wrong path is a vhost
    # that will not load.
    ssl_certificate     /etc/nginx/ssl-certificates/www.gemreserve.io.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/www.gemreserve.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/GemReserve/wordpress;
    index index.php;

    # --- Security headers -------------------------------------------------
    add_header Content-Security-Policy   $gr_csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    client_max_body_size 32m;

    # --- Refuse everything that is not the site --------------------------
    # Order matters: these must precede the PHP handler, or a request for
    # wp-config.php is answered by executing it rather than by refusing it.

    # Dotfiles: .git, .env, and the SQLite database's .ht.sqlite name.
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # Databases and dumps, in every form they might take.
    location ~* /wp-content/database/ { deny all; }
    location ~* \.(sqlite|sqlite3|db|sql|gz|tar|zip|bak|swp|old|orig|ini|log)$ { deny all; }

    # Config and secrets.
    location = /wp-config.php  { deny all; }
    location = /wp-salts.php   { deny all; }
    location = /router.php     { deny all; }   # staging only; never production
    location ~ ^/gr-[a-z-]+\.php$ { deny all; }  # migration scripts
    location ^~ /backups/      { deny all; }
    location ^~ /migrations/   { deny all; }

    # WordPress's own noise.
    location = /readme.html    { deny all; }
    location = /license.txt    { deny all; }
    location = /wp-config-sample.php { deny all; }

    # XML-RPC is disabled in code; refuse it at the edge too so the request
    # never reaches PHP.
    location = /xmlrpc.php { deny all; access_log off; }

    # Uploads hold data, never code.
    location ~* /wp-content/uploads/.*\.(php|phtml|phar|cgi|pl|py|sh)$ { deny all; }

    # Theme and plugin PHP is included by WordPress, never requested.
    location ~* /wp-content/(themes|plugins|mu-plugins)/.+\.php$ { deny all; }

    # --- Things WordPress must answer, not the filesystem -----------------
    # Both are generated by PHP here. Without these they would fall to
    # try_files and 404 on a missing static file.
    location = /robots.txt  { try_files $uri /index.php?$args; access_log off; }
    location = /sitemap.xml { try_files $uri /index.php?$args; }

    # --- Static assets ----------------------------------------------------
    # The image derivatives and the stylesheet change only on deploy.
    location ~* ^/wp-content/themes/gemreserve/assets/.+\.(css|js|webp|avif|png|jpe?g|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(css|js|webp|avif|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # --- Login and admin --------------------------------------------------
    location = /wp-login.php {
        limit_req zone=gr_login burst=5 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:19000;
    }

    location = /wp-admin/admin-post.php {
        limit_req zone=gr_forms burst=10 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:19000;
    }

    # --- WordPress front controller ---------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        fastcgi_pass 127.0.0.1:19000;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}

# Apex and http redirect to the canonical www host. Measured live: gemreserve.io
# returns 301 to https://www.gemreserve.io/. This preserves that direction.
server {
    listen 80;
    listen [::]:80;
    server_name gemreserve.io www.gemreserve.io;
    return 301 https://www.gemreserve.io$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gemreserve.io;
    # CONFIRM: same two paths as above.
    ssl_certificate     /etc/nginx/ssl-certificates/www.gemreserve.io.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/www.gemreserve.io.key;
    return 301 https://www.gemreserve.io$request_uri;
}
